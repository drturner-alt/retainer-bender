[project]
name = "retainer-bender"
version = "0.1.0"
description = "Plan and bend flat lower 3-3 lingual retainer wires from intraoral scans"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
machine = ["pyserial>=3.5"]
test = ["pytest>=7"]
cad = ["manifold3d>=2.3"]

[project.scripts]
rbend = "retainer_bender.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["retainer_bender"]
